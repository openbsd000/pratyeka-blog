<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #2c3e50;
    min-height: 100vh; padding: 40px 16px;
  }
  .container { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 2rem; letter-spacing: 1px; }
  header p { color: #8492a6; margin-top: 6px; font-size: .9rem; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type=search] {
    flex: 1; min-width: 180px; padding: 8px 12px;
    border: 1px solid #dcdfe6; border-radius: 6px; font-size: .9rem;
  }
  .toolbar select {
    padding: 8px 10px; border: 1px solid #dcdfe6; border-radius: 6px;
    background: #fff; font-size: .85rem;
  }
  .panel { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  ul.postlist { list-style: none; }
  ul.postlist li {
    padding: 12px 4px; border-bottom: 1px solid #eef0f3;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  ul.postlist li:last-child { border-bottom: none; }
  ul.postlist a { color: #2f6fdd; text-decoration: none; font-size: 1rem; word-break: break-all; }
  ul.postlist a:hover { text-decoration: underline; }
  .meta { color: #a0a8b4; font-size: .8rem; white-space: nowrap; }
  .empty, .hint { color: #8492a6; text-align: center; padding: 24px 8px; font-size: .9rem; line-height: 1.7; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .pager button {
    padding: 6px 12px; border: 1px solid #dcdfe6; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: .85rem;
  }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager button.cur { background: #2f6fdd; color: #fff; border-color: #2f6fdd; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>blog</h1>
    <p>本地目录文章自动索引</p>
  </header>

  <div id="statusPanel" class="panel">
    <p class="hint" id="statusText">正在自动加载文章列表…</p>
  </div>

  <div id="mainPanel" class="panel" style="display:none">
    <div class="toolbar">
      <input type="search" id="searchBox" placeholder="搜索文章文件名…">
      <select id="pageSizeSel">
        <option value="10">每页 10 条</option>
        <option value="20" selected>每页 20 条</option>
        <option value="50">每页 50 条</option>
      </select>
      <select id="sortSel">
        <option value="name-asc">名称 A→Z</option>
        <option value="name-desc">名称 Z→A</option>
        <option value="date-desc" selected>修改时间 新→旧</option>
        <option value="date-asc">修改时间 旧→新</option>
      </select>
    </div>
    <ul class="postlist" id="postList"></ul>
    <div class="empty" id="emptyTip" style="display:none">没有找到除 index.html 之外的 HTML 文件</div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
let allFiles = [];   // {name, url, mtime}
let page = 1;

/* ---------- 自动加载：优先 list.php 服务端扫描，其次服务器目录索引 ---------- */
async function loadFromAutoIndex() {
  // 请求当前目录 URL（需服务器开启 autoindex / Indexes / http.server 目录列表）
  const dir = location.href.replace(/index\.html?$/i, '');
  const resp = await fetch(dir, { cache: 'no-store' });
  if (!resp.ok) return null;
  const text = await resp.text();
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const map = new Map();
  doc.querySelectorAll('a[href]').forEach(a => {
    let href = a.getAttribute('href');
    if (!href || /^(https?:|mailto:|\/|#|\?)/.test(href)) return;
    href = href.replace(/\/$/, '').split('/').pop();
    let name;
    try { name = decodeURIComponent(href); } catch (e) { name = href; }
    if (!/\.html?$/i.test(name)) return;
    if (name.toLowerCase() === 'index.html') return;
    if (!map.has(name)) map.set(name, { name, url: href, mtime: 0 });
  });
  return map.size ? [...map.values()] : null;
}

async function loadFromPhp() {
  // 首选：list.php 在服务器端直接扫描当前目录
  const resp = await fetch('list.php', { cache: 'no-store' });
  if (!resp.ok) return null;
  const data = await resp.json();
  if (!Array.isArray(data)) return null;
  return data.map(f => ({ name: f.name, url: encodeURIComponent(f.name), mtime: f.mtime || 0 }));
}

async function boot() {
  try {
    allFiles = await loadFromPhp() || await loadFromAutoIndex();
  } catch (e) { allFiles = null; }
  if (!allFiles) {
    document.getElementById('statusText').innerHTML =
      '自动加载失败：请确认 <code>index.html</code> 和 <code>list.php</code> 已一起上传到同一目录，且服务器 PHP 已启用。';
    return;
  }
  render();
}

/* ---------- 渲染 + 分页 ---------- */
function filteredSorted() {
  const kw = document.getElementById('searchBox').value.trim().toLowerCase();
  const sort = document.getElementById('sortSel').value;
  let list = allFiles.filter(f => !kw || f.name.toLowerCase().includes(kw));
  list.sort((a, b) => {
    if (sort === 'name-asc')  return a.name.localeCompare(b.name, 'zh');
    if (sort === 'name-desc') return b.name.localeCompare(a.name, 'zh');
    if (sort === 'date-asc')  return (a.mtime || 0) - (b.mtime || 0) || a.name.localeCompare(b.name);
    return (b.mtime || 0) - (a.mtime || 0) || b.name.localeCompare(a.name);
  });
  return list;
}

function render() {
  document.getElementById('statusPanel').style.display = 'none';
  document.getElementById('mainPanel').style.display = '';

  const list = filteredSorted();
  const size = +document.getElementById('pageSizeSel').value;
  const pages = Math.max(1, Math.ceil(list.length / size));
  page = Math.min(Math.max(1, page), pages);

  const ul = document.getElementById('postList');
  ul.innerHTML = '';
  document.getElementById('emptyTip').style.display = list.length ? 'none' : '';

  for (const f of list.slice((page - 1) * size, page * size)) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = f.url;
    a.textContent = f.name.replace(/\.html?$/i, '');
    a.target = '_blank';
    li.appendChild(a);
    if (f.mtime) {
      const span = document.createElement('span');
      span.className = 'meta';
      span.textContent = new Date(f.mtime * (f.mtime < 1e12 ? 1000 : 1)).toLocaleDateString();
      li.appendChild(span);
    }
    ul.appendChild(li);
  }

  const pager = document.getElementById('pager');
  pager.innerHTML = '';
  if (pages > 1) {
    pager.appendChild(pBtn('« 上一页', page > 1, () => { page--; render(); }));
    for (const p of pageWindow(page, pages)) {
      if (p === '…') { const s = document.createElement('span'); s.textContent = '…'; pager.appendChild(s); continue; }
      const b = pBtn(String(p), true, () => { page = p; render(); });
      if (p === page) b.classList.add('cur');
      pager.appendChild(b);
    }
    pager.appendChild(pBtn('下一页 »', page < pages, () => { page++; render(); }));
    const info = document.createElement('span');
    info.className = 'meta';
    info.textContent = ' 共 ' + list.length + ' 篇 / ' + pages + ' 页';
    pager.appendChild(info);
  }
}

function pBtn(text, enabled, fn) {
  const b = document.createElement('button');
  b.textContent = text;
  b.disabled = !enabled;
  b.onclick = fn;
  return b;
}

function pageWindow(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const out = [1];
  const s = Math.max(2, cur - 1), e = Math.min(total - 1, cur + 1);
  if (s > 2) out.push('…');
  for (let i = s; i <= e; i++) out.push(i);
  if (e < total - 1) out.push('…');
  out.push(total);
  return out;
}

document.getElementById('searchBox').addEventListener('input', () => { page = 1; render(); });
document.getElementById('pageSizeSel').addEventListener('change', () => { page = 1; render(); });
document.getElementById('sortSel').addEventListener('change', () => render());

boot();
</script>
</body>
</html>
